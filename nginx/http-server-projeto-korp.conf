# =============================================================================
# http-server-projeto-korp.conf
# Configuração de proxy reverso do NGINX.
#
# Objetivo: receber requisições na porta 80 e encaminhá-las (fazer o
# "proxy") para o container da aplicação Go, que escuta na porta 8080.
#
# Esse arquivo é montado dentro do container do NGINX, no caminho
# /etc/nginx/conf.d/, que é onde o NGINX procura automaticamente por
# arquivos de configuração adicionais.
# =============================================================================

server {
    # Porta em que o NGINX vai escutar DENTRO do container.
    # É essa porta 80 que o docker-compose mapeia para a porta 80 do host.
    listen 80;

    # Nome do "site" — não é usado para roteamento aqui, mas é uma boa
    # prática identificar o server_name mesmo em configs simples.
    server_name localhost;

    # Bloco de localização: define o que fazer quando uma requisição
    # chega em qualquer caminho ("/") a partir da raiz.
    location / {

        # proxy_pass define para onde a requisição deve ser encaminhada.
        # "http-server-projeto-korp" é o NOME DO SERVIÇO definido no
        # docker-compose.yml — e não um IP fixo. Isso funciona porque,
        # dentro de uma mesma rede Docker (bridge, definida pelo usuário),
        # o Docker fornece um DNS interno que resolve o nome do serviço
        # para o IP correto do container automaticamente.
        proxy_pass http://http-server-projeto-korp:8080;

        # Os cabeçalhos abaixo preservam informações da requisição
        # original do cliente, que se perderiam por padrão ao passar
        # pelo proxy (o NGINX, por padrão, faria uma nova requisição
        # "limpa" para o backend).

        # Repassa o "Host" original solicitado pelo cliente.
        proxy_set_header Host $host;

        # Informa ao backend qual foi o IP real do cliente que fez a
        # requisição (sem isso, o backend veria sempre o IP do NGINX).
        proxy_set_header X-Real-IP $remote_addr;

        # Mantém o histórico de IPs, caso a requisição passe por mais
        # de um proxy no caminho (boa prática, mesmo em setups simples).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Informa ao backend se a requisição original era HTTP ou HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint interno usado pelo exporter para medir o Nginx.
    location = /nginx_status {
        stub_status;
        allow 172.16.0.0/12;
        deny all;
    }
}
